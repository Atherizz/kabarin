services:
  postgres:
    image: postgres:16-alpine
    container_name: kabarin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kabarin_user
      POSTGRES_PASSWORD: kabarin_password
      POSTGRES_DB: kabarin_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabarin_user -d kabarin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kabarin_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://kabarin_user:kabarin_password@postgres:5432/kabarin_db"
    ports:
      - "3000:3000"
    volumes:
      # Persist Baileys WhatsApp session
      - ./apps/api/auth_session:/app/apps/api/auth_session
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
